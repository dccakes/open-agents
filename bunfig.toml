# Supply-chain cooldown — WS-0.2b, see docs/plans/ws-0.2b-bunfig-cooldown.md.
# Requires Bun >= 1.2.20; this repo pins bun@1.3.14 via `packageManager`.

[install]

# Refuse to resolve any package version published less than 7 days ago.
# npm supply-chain compromises are typically caught and unpublished within hours
# to a few days, so never taking a brand-new version removes the window they live in.
minimumReleaseAge = 604800

# What this protects, honestly:
#
# The cooldown gates *resolution* — the moment a version is chosen for the
# lockfile (`bun add`, `bun update`, or an install whose config changed). When a
# range still has an eligible older version, Bun silently picks it instead of
# failing, so a too-new release shows up as an older-than-expected version in the
# lockfile diff, not as an error. When *no* version in the range is old enough,
# resolution is a hard error (see the exclusion below).
#
# It does not re-screen versions already pinned in `bun.lock`. CI's
# `bun install --frozen-lockfile` installs what the lockfile says; a compromised
# version that made it in stays until someone updates it. The cooldown protects
# entry, not residency.

# Escape hatch. Packages listed here skip the cooldown entirely — they are not
# "trusted", they are "cooldown cannot be applied here", so keep this list short
# and justify every entry.
#
# Use it for an urgent security patch published inside the window: add the
# package, land the bump, then remove the entry in a follow-up.
#
# @daytonaio/sdk: the optional Daytona sandbox provider ships a new 0.x minor
# every few days. Caret ranges on 0.x pin the minor (`^0.203.0` means
# `>=0.203.0 <0.204.0`), so the range is a single release line — today only
# 0.203.0, published 2026-07-31 — every version in it is inside the cooldown, and
# `bun install` fails outright instead of falling back to an older release.
# Removing this entry needs the range in packages/sandbox/package.json widened or
# pinned to an aged version; tracked as a follow-up in the WS-0.2b plan.
minimumReleaseAgeExcludes = ["@daytonaio/sdk"]
